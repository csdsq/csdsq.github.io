<!-- Waline Comment System -->
{% if site.comments.waline.server_url %}
<link rel="stylesheet" href="https://unpkg.com/@waline/client@v3/dist/waline.css" />
<div id="waline-comment"></div>
<script type="module">
  import { init } from 'https://unpkg.com/@waline/client@v3/dist/waline.js';
  init({
    el: '#waline-comment',
    serverURL: '{{ site.comments.waline.server_url }}',
    lang: '{{ site.comments.waline.lang | default: "zh-CN" }}',
    {% if site.comments.waline.locale %}
    locale: {{ site.comments.waline.locale | jsonify }},
    {% endif %}
    pageview: false, // pageview is handled separately in panel-stats
  });
</script>
{% else %}
<div class="text-muted text-center py-3">
  <i class="fas fa-comment-slash fa-2x mb-2"></i>
  <p>评论系统配置中，敬请期待...</p>
</div>
{% endif %}
